name: release-please

# Merging the release PR tags the release, and ci.yml builds the image for the tag. A GitHub App
# token, because a tag pushed with GITHUB_TOKEN triggers no further workflow, and an App key does not
# expire the way a PAT does.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token }}
